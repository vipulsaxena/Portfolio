<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Presentation mode — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="../admin.css">
  <link rel="stylesheet" href="../../css/follow-me.css">
  <link rel="icon" href="../../fav.png" type="image/png">
</head>
<body class="admin-present">
  <header class="admin-header">
    <div class="admin-header__inner">
      <p class="admin-logo"><span></span>Presentation mode</p>
      <button type="button" class="admin-btn admin-btn--ghost hidden" id="logout-btn">Log out</button>
    </div>
  </header>

  <main class="admin-main hidden" id="admin-home">
    <a class="admin-back" href="../">&larr; Admin</a>
    <div class="present-app" id="present-app"></div>
  </main>
  <script src="../../js/vipul-chat-config.js?v=11"></script>
  <script src="../admin-config.js"></script>
  <script src="../admin-gate.js"></script>
  <script>
    document.addEventListener("admin:ready", function () {
      if (window.__vipulFollowMeStarted) return;
      var s = document.createElement("script");
      s.src = "../../js/follow-me.js?v=13";
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
