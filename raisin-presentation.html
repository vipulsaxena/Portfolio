  <script>
    (function () {
      var KEY = "raisinAccessGranted";
      function navType() {
        try {
          var e = performance.getEntriesByType && performance.getEntriesByType("navigation");
          if (e && e.length) return e[0].type;
          if (performance.navigation) return ["navigate", "reload", "back_forward"][performance.navigation.type] || "navigate";
        } catch (_) {}
        return "navigate";
      }
      var internal = false;
      try { internal = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (_) {}
      var t = navType();
      var external = (t !== "reload" && t !== "back_forward") && !internal;
      var allow = false;
      try {
        if (sessionStorage.getItem("vipulFollow") || sessionStorage.getItem("vipulPresent")) {
          sessionStorage.setItem(KEY, "1");
          allow = true;
        } else if (external) {
          sessionStorage.removeItem(KEY);
        } else {
          allow = sessionStorage.getItem(KEY) === "1";
        }
      } catch (_) {}
      window.__gateAllow = allow;
      if (!allow) document.documentElement.classList.add("raisin-present-locked");
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base:  '#ffffff',
            elev:  '#f7f7f7',
            card:  '#ffffff',
            line:  '#e7e7e7',

          maxWidth: { content: '80rem' },
        }
      }

  <style type="text/css">
    :root {
      --deck-top: 3.5rem;
      --ink: #262626;
      --muted: #6e6e6e;
      --line: #e7e7e7;
      --paper: #ffffff;
      --paper-dim: #f7f7f7;
      --card: #ffffff;
      --accent: #ffda08;
      --accent-soft: #fff3b0;
      --client: #3096ff;
      --client-soft: #e4f1ff;
      --good: #2f7a52;
      --warn: #d98c3d;
      --fade-ms: 300ms;
    }
    html, body { height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      overflow: hidden;
    }
    .hl {
      background: var(--accent);
      color: var(--ink);
      padding: 0 .1em;
      border-radius: .08em;
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
    }

    .deck {
      position: fixed;
      inset: 0;
      top: var(--deck-top);
      overflow: hidden;
    }
    .deck-stage {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .slide {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--fade-ms) ease;
    }
    .slide.is-active {
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }
    .slide.is-leaving {
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }
    .slide-inner {
      margin: 0 auto;
      width: 100%;
      max-width: 80rem;
      padding: clamp(1.25rem, 3vw, 2.5rem) clamp(1.25rem, 5vw, 4rem);
      padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px));
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100%;
      box-sizing: border-box;
    }

    .slide-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.85rem;
      line-height: 1.4;
    }
    .slide-label--practice::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--accent);
      margin-right: 0.5rem;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }
    .slide-label--enablement::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--client);
      margin-right: 0.5rem;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }
    .slide-title {
      font-size: clamp(2rem, 4.2vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.12;
      color: var(--ink);
      margin: 0 0 1.25rem;
      max-width: 22ch;
    }
    .slide-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-top: 1rem;
    }
    .slide-chip {
      display: inline-flex;
      align-items: center;
      font-size: 0.875rem;
      line-height: 1.3;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--paper-dim);
    }
    .slide-chip--risk {
      border-color: rgba(217, 140, 61, 0.55);
      color: #8a5a20;
      background: #fff8ee;
    }

    .artifact {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: min(58vh, 520px);
      margin: 0.5rem 0;
    }
    .artifact img,
    .artifact video {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0.75rem;
      border: 1px solid var(--line);
      background: #fafafa;
    }

    .artifact-triptych {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      width: 100%;
      height: 100%;
      align-items: stretch;
    }
    .artifact-triptych__cell {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-width: 0;
    }
    .artifact-triptych__cell img {
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 180px;
      object-fit: cover;
      object-position: top center;
    }
    .artifact-triptych__cap {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
    }

    .artifact-ab {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      width: 100%;
      height: 100%;
    }
    .artifact-ab__panel {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-width: 0;
      min-height: 0;
    }
    .artifact-ab__media {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      border-radius: 0.75rem;
      border: 1px solid var(--line);
      background: #fafafa;
      overflow: hidden;
    }
    .artifact-ab__media img,
    .artifact-ab__media video {
      width: 100%;
      height: 100%;
      max-height: 42vh;
      object-fit: contain;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .artifact-ab__tag {
      position: absolute;
      top: 0.65rem;
      left: 0.65rem;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .artifact-ab__panel--chosen .artifact-ab__media {
      border-color: rgba(255, 218, 8, 0.55);
      box-shadow: 0 0 0 1px rgba(255, 218, 8, 0.2);
    }
    .artifact-ab__panel--chosen .artifact-ab__tag {
      background: var(--accent);
      color: #262626;
      border-color: var(--accent);
    }
    .artifact-ab__tag--chosen::after {
      content: " · CHOSEN";
    }
    .artifact-ab__split {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 220px;
    }
    .artifact-ab__split img {
      width: 100%;
      height: 100%;
      max-height: 42vh;
      object-fit: contain;
    }
    .artifact-ab__split .artifact-ab__tag--a { left: 25%; transform: translateX(-50%); }
    .artifact-ab__split .artifact-ab__tag--b { left: 75%; transform: translateX(-50%); }

    .artifact-before-after {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      width: 100%;
    }
    .artifact-before-after__panel {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .artifact-before-after__panel img {
      width: 100%;
      max-height: 42vh;
      object-fit: contain;
    }

    .artifact-stat {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      max-width: 36rem;
    }
    .artifact-stat__targets {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding: 1rem 1.25rem;
      border-radius: 0.75rem;
      border: 1px dashed var(--line);
      background: rgba(255, 255, 255, 0.02);
    }
    .artifact-stat__targets-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .artifact-stat__target {
      font-size: 0.95rem;
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }
    .artifact-stat__hero {
      font-size: clamp(3.5rem, 10vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .artifact-stat__hero span {
      color: var(--muted);
      font-size: 0.45em;
      font-weight: 700;
      vertical-align: middle;
      margin: 0 0.15em;
    }
    .artifact-stat__quote {
      margin: 0;
      padding: 1rem 1.25rem;
      border-left: 3px solid var(--accent);
      background: var(--paper-dim);
      border-radius: 0 0.5rem 0.5rem 0;
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--ink);
      font-style: italic;
    }
    .artifact-stat__quote cite {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      font-style: normal;
      font-weight: 600;
      color: var(--muted);
    }

    .artifact-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.85rem;
      width: 100%;
    }
    .artifact-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      background: var(--card);
      overflow: hidden;
      min-height: 280px;
    }
    .artifact-card__head {
      padding: 0.85rem 1rem 0.5rem;
    }
    .artifact-card__title {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.35rem;
    }
    .artifact-card__impact {
      font-size: 0.82rem;
      line-height: 1.35;
      color: var(--ink);
      margin: 0;
    }
    .artifact-card__media {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      min-height: 140px;
      background: #fafafa;
    }
    .artifact-card__media img,
    .artifact-card__media video {
      max-width: 100%;
      max-height: 160px;
      object-fit: contain;
      border: 0;
      border-radius: 0.35rem;
      background: transparent;
    }

    .artifact-grid2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
      width: 100%;
    }
    .artifact-grid2x2__cell {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .artifact-grid2x2__cell img {
      width: 100%;
      max-height: 22vh;
      object-fit: contain;
      background: #fafafa;
    }
    .artifact-grid2x2__cap {
      font-size: 0.8rem;
      line-height: 1.35;
      color: var(--muted);
      margin: 0;
    }

    .artifact-close {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
    }
    .artifact-close__cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    .artifact-close__col {
      padding: 1rem 1.15rem;
      border-radius: 0.75rem;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.02);
    }
    .artifact-close__col--enablement {
      border-color: rgba(48, 150, 255, 0.35);
      background: var(--client-soft);
    }
    .artifact-close__col-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 0.75rem;
    }
    .artifact-close__col--enablement .artifact-close__col-label {
      color: var(--client);
    }
    .artifact-close__stat {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      color: var(--ink);
      margin: 0 0 0.5rem;
    }
    .artifact-close__stat--miss {
      color: var(--muted);
      font-weight: 600;
    }
    .artifact-close__testimonials {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.65rem;
    }
    .artifact-close__quote {
      margin: 0;
      padding: 0.75rem;
      font-size: 0.68rem;
      line-height: 1.4;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.02);
    }
    .artifact-close__quote strong {
      display: block;
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 0.35rem;
    }

    .progress {
      position: fixed;
      top: var(--deck-top);
      left: 0;
      height: 3px;
      z-index: 950;
      background: var(--accent);
      width: 0;
      transition: width var(--fade-ms) ease;
    }
    .deck-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ---------- Intro & highlight layouts ---------- */
    .intro-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(1.5rem, 4vw, 3rem);
      align-items: center;
      width: 100%;
    }
    .intro-eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 1rem;
    }
    .intro-title {
      font-size: clamp(2rem, 4.5vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.08;
      color: var(--ink);
      margin: 0 0 1rem;
      max-width: 16ch;
    }
    .intro-body {
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 0.85rem;
      max-width: 48ch;
    }
    .intro-body strong { color: var(--ink); font-weight: 700; }
    .intro-media img {
      width: 100%;
      max-height: min(62vh, 520px);
      object-fit: contain;
      border-radius: 1rem;
      border: 1px solid var(--line);
      background: var(--paper-dim);
    }
    .intro-bento {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 0.5rem;
      max-height: min(62vh, 480px);
    }
    .intro-bento img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0.65rem;
      border: 1px solid var(--line);
    }
    .intro-bento__item:nth-child(1) { grid-column: 1 / 4; grid-row: 1 / 3; }
    .intro-bento__item:nth-child(2) { grid-column: 4 / 7; grid-row: 1 / 3; }
    .intro-bento__item:nth-child(3) { grid-column: 1 / 3; grid-row: 3 / 5; }
    .intro-bento__item:nth-child(4) { grid-column: 3 / 5; grid-row: 3 / 5; }
    .intro-bento__item:nth-child(5) { grid-column: 5 / 7; grid-row: 3 / 5; }
    .crumb {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 600;
      margin: 0 0 1rem;
    }
    .crumb .sep { color: #c4c4c4; }
    .crumb .now {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-color: var(--accent);
      text-decoration-thickness: 3px;
      text-underline-offset: 3px;
    }
    .intro-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .intro-list li {
      display: flex;
      gap: 0.65rem;
      font-size: 1rem;
      line-height: 1.45;
      color: var(--muted);
    }
    .intro-list .mark {
      flex-shrink: 0;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--ink);
      font-size: 0.75rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .case-cover {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
      align-items: end;
      width: 100%;
      padding: clamp(1.5rem, 4vw, 2.5rem);
      border-radius: 1.25rem;
      background: var(--accent-soft);
      border: 1px solid rgba(255, 218, 8, 0.45);
    }
    .case-cover__title {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      color: var(--ink);
      margin: 0 0 0.75rem;
      max-width: 14ch;
    }
    .case-cover__sub {
      font-size: 1.15rem;
      line-height: 1.45;
      color: var(--muted);
      margin: 0;
      max-width: 42ch;
    }
    .case-cover__meta {
      display: inline-flex;
      margin-top: 1.25rem;
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      background: var(--ink);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .case-cover img {
      width: 100%;
      max-height: 42vh;
      object-fit: contain;
      border-radius: 0.75rem;
    }
    .wrap-up {
      text-align: center;
      max-width: 52rem;
      margin: 0 auto;
    }
    .wrap-up__title {
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.12;
      margin: 0 0 1rem;
      color: var(--ink);
    }
    .wrap-up__text {
      font-size: 1.1rem;
      line-height: 1.55;
      color: var(--muted);
      margin: 0 0 1.5rem;
    }
    .wrap-up__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .shell-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.75rem 1.35rem;
      border-radius: 999px;
      border: 0;
      background: var(--accent);
      color: var(--ink);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .shell-btn:hover { filter: brightness(1.04); transform: translateY(-1px); }
    .shell-btn--ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }
    .shell-btn--ghost:hover { border-color: var(--accent); background: var(--accent-soft); }
    .kbd {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .key {
      display: inline-block;
      min-width: 1.5rem;
      padding: 0.15rem 0.4rem;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 700;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 0.4rem;
      background: #fff;
      color: var(--ink);
    }
    .hl-slide {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      align-items: center;
      width: 100%;
    }
    .hl-slide__media img {
      width: 100%;
      max-height: min(50vh, 440px);
      object-fit: contain;
      border-radius: 0.85rem;
      border: 1px solid var(--line);
      background: var(--paper-dim);
    }

  function updateChrome() {
    var slide = SLIDES[i];
    dots.forEach(function (d, idx) {
      d.setAttribute("aria-current", String(idx === i));
    });
    var ch = chapterOf(i);
    var onHome = SLIDES[i].homeSlide;
    chapterTabs.forEach(function (t, ci) {
      var cur = !onHome && chapters[ci] === ch;
      t.setAttribute("aria-current", String(cur));
      var cnt = t.querySelector(".ct-count");
      if (cnt && cur && ch.countSlides.length) {
        cnt.textContent = (ch.countSlides.indexOf(i) + 1) + "/" + ch.countSlides.length;
      } else if (cnt) {
        cnt.textContent = String(chapters[ci].countSlides.length);
      }
    });
    curNum.textContent = pad(i + 1);
    progress.style.width = ((i + 1) / N) * 100 + "%";
    deckTitle.textContent = (slide.title || slide.label || "Raisin") + " — Raisin";
    prevBtns.forEach(function (b) {
      b.classList.toggle("is-hidden", i === 0);
      b.disabled = i === 0;
    });
    var onLast = i === N - 1;
    nextBtns.forEach(function (b) {
      b.classList.toggle("hidden", onLast);
      b.disabled = onLast;
    });
    backToCase.classList.toggle("hidden", !onLast);
    if (history.replaceState) history.replaceState(null, "", "#" + (i + 1));
    window.PortfolioDeck = { pageId: "raisin", getIndex: function () { return i; }, go: go };
    window.dispatchEvent(new CustomEvent("portfolio:deck-change", { detail: { slide: i + 1 } }));
  }

  function go(n) {
    var next = Math.max(0, Math.min(N - 1, n));
    if (next === i && currentSlideEl) return;
    i = next;
    renderSlide(i);
    updateChrome();
  }
  var next = function () { go(i + 1); };
  var prev = function () { go(i - 1); };

  prevBtns.forEach(function (b) { b.addEventListener("click", prev); });
  nextBtns.forEach(function (b) { b.addEventListener("click", next); });

  document.addEventListener("keydown", function (e) {
    if (e.target.closest("input, textarea, iframe, [contenteditable]")) return;
    if (e.key === "Escape") {
      e.preventDefault();
      location.href = "raisin.html";
      return;
    }
    switch (e.key) {
      case "ArrowRight":
      case "PageDown":
        e.preventDefault();
        next();
        break;
      case " ":
        e.preventDefault();
        e.shiftKey ? prev() : next();
        break;
      case "ArrowLeft":
      case "PageUp":
        e.preventDefault();
        prev();
        break;
      case "Home":
        e.preventDefault();
        go(0);
        break;
      case "End":
        e.preventDefault();
        go(N - 1);
        break;
    }
  });

  var x0 = null, y0 = null, sdx = 0, sdy = 0, axis = null;
  track.addEventListener("touchstart", function (e) {
    if (e.touches.length !== 1) { x0 = null; return; }
    x0 = e.touches[0].clientX;
    y0 = e.touches[0].clientY;
    sdx = sdy = 0;
    axis = null;
  }, { passive: true });
  track.addEventListener("touchmove", function (e) {
    if (x0 === null) return;
    sdx = e.touches[0].clientX - x0;
    sdy = e.touches[0].clientY - y0;
    if (!axis && (Math.abs(sdx) > 8 || Math.abs(sdy) > 8)) {
      axis = Math.abs(sdx) > Math.abs(sdy) ? "x" : "y";
    }
    if (axis === "x" && e.cancelable) e.preventDefault();
  }, { passive: false });
  track.addEventListener("touchend", function () {
    if (x0 === null) return;
    if (axis === "x" && Math.abs(sdx) > 45) (sdx < 0 ? next() : prev());
    x0 = y0 = null;
    axis = null;
  }, { passive: true });
  track.addEventListener("touchcancel", function () {
    x0 = y0 = null;
    axis = null;
  }, { passive: true });

  var fsBtn = document.querySelector("[data-fullscreen]");
  if (fsBtn) {
    fsBtn.addEventListener("click", function () {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    });
  }

  var start = parseInt((location.hash || "").replace("#", ""), 10);
  if (!isNaN(start) && start >= 1 && start <= N) i = start - 1;
  go(i);
})();
</script>

      } else {

        input.focus();
        input.select();
      }
    });
  })();
</script>
