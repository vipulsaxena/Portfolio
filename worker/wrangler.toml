name = "portfolio-chat"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# After `wrangler d1 create portfolio-chat`, paste database_id below:
[[d1_databases]]
binding = "DB"
database_name = "portfolio-chat"
database_id = "37974f27-bfff-4e0d-b1a1-8c5b3ccb9c9b"

[vars]
ALLOWED_ORIGINS = "https://vipulsaxena.com,https://www.vipulsaxena.com,http://localhost:8080,http://127.0.0.1:8080"

[ai]
binding = "AI"

[durable_objects]
bindings = [{ name = "PRESENTATION", class_name = "PresentationRoom" }]

[[migrations]]
tag = "v1-presentation"
new_sqlite_classes = ["PresentationRoom"]
